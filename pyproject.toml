[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rdf-vocabulary-conformance-service"
version = "0.1.0"
description = "Deterministic conformance checks for a research vocabulary (OWL/SKOS/SHACL) and the JSON data records that use it, parameterized by a data-only configuration file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "561 Group" }]
keywords = ["rdf", "owl", "skos", "shacl", "json-ld", "ontology", "conformance", "research-data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "rdflib==7.6.0",
  "pyshacl==0.40.1",
  "PyLD==3.3.0",
  # transitive pins, as resolved with Python 3.12.3
  "owlrl==7.6.2",
  "prettytable==3.18.0",
  "wcwidth==0.9.4",
  "pyparsing==3.3.3",
  "packaging==26.3",
  "lxml==6.1.3",
  "html5rdf==1.2.1",
  "frozendict==2.4.7",
  "cachetools==7.2.4",
]

[project.urls]
Repository = "https://github.com/red-cup-engineering/rdf-vocabulary-conformance-service"

[project.scripts]
check-vocabulary-conformance = "rdf_vocabulary_conformance.cli:main"
check-vocabulary-conformance-ndjson = "rdf_vocabulary_conformance.ndjson:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdf_vocabulary_conformance = ["conformance.schema.json"]
