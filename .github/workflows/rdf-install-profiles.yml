name: Receive RDF install profiles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        profile: [lean, full]
    env:
      RDF_VOCABULARY_TEST_INSTALL: ${{ matrix.profile }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the requested profile outside the checkout
        run: |
          set -euo pipefail
          scope=$(mktemp -d "$RUNNER_TEMP/rdf-wheel.XXXXXXXX")
          python -m pip wheel --no-deps --wheel-dir "$scope" .
          wheels=("$scope"/*.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          python -m venv "$scope/venv"
          exact=("${wheels[0]}")
          if [[ "$RDF_VOCABULARY_TEST_INSTALL" == full ]]; then
            exact+=('rdf-vocabulary-conformance-service[conformance]')
          fi
          receiver="$scope/venv/bin/python"
          "$receiver" -m pip install "${exact[@]}"
          "$receiver" -m pip check
          cd "$RUNNER_TEMP"
          "$receiver" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
